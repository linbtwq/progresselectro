<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F7">
    <title>Прогрес Електро</title>
    <link rel="icon" type="image/jpeg" href="images.jpg">
    <link rel="apple-touch-icon" href="images.jpg">

    <script>
    (function () {
        try {
            var cores = navigator.hardwareConcurrency || 4;
            var mem = navigator.deviceMemory || 4;
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var touch = window.matchMedia('(pointer: coarse)').matches;
            var w = window.innerWidth;
            var c = document.documentElement.classList;
            if (reduce || cores <= 2 || mem <= 2) c.add('low-end');
            if (touch) c.add('is-touch');
            if (w >= 900) c.add('is-wide');
        } catch (e) {}
    })();
    </script>

    <script>
    (function () {
        try {
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark-theme-boot');
            }
            var savedFont = localStorage.getItem('fontScale');
            if (savedFont) document.documentElement.style.fontSize = savedFont;
        } catch (e) {}
    })();
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="topProgress" class="top-progress"></div>

    <!-- Экран входа -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h2>Прогрес Електро</h2>
            <p>Введіть ваш ПІН-код для початку роботи</p>
            <input type="password" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••">
            <div id="authError" class="auth-error" style="display: none;">Невірний ПІН-код</div>
            <button class="action-btn" onclick="login()">Увійти</button>
        </div>
    </div>

    <!-- Верхняя панель с профилем и настройками -->
    <header class="top-bar">
        <div class="app-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/></svg></span><span>Прогрес<small>Електро</small></span></div>
        <div class="header-actions"><div id="userBadge" class="user-badge"></div><div id="connectionStatus" class="connection-status" title="Натисніть для оновлення">
        <div class="status-dot"></div>
        <div class="status-content">
            <span class="status-text">Перевірка зв'язку...</span>
            <span class="status-time" id="statusTime"></span>
        </div>
    </div><button id="settingsBtn" class="settings-btn" aria-expanded="false" aria-controls="settingsMenu" aria-haspopup="dialog" aria-label="Налаштування">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button></div>
    </header>

    <!-- Меню настроек -->
    <div id="settingsMenu" class="modal-overlay settings-overlay">
        <section class="modal-box settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <header class="modal-header"><h3 id="settingsTitle">Налаштування</h3><button type="button" class="modal-close" id="settingsClose" aria-label="Закрити налаштування">✕</button></header>
            <div class="modal-body"><p class="settings-section">Оформлення</p>
        <button id="themeToggle" class="menu-item">
            <span>Темна тема</span>
            <span class="menu-icon theme-switch" id="themeIcon" aria-hidden="true"></span>
        </button>
        <button id="fontScaleBtn" class="menu-item">
            <span>Розмір шрифту</span>
            <span class="menu-value" id="fontScaleValue">A</span>
        </button>
        <p class="settings-section">Документи та дані</p>
        <button id="invoiceHistoryBtn" class="menu-item"><span>Історія документів</span><span class="menu-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5v18h14V3h-3M8 3v4h8V3H8ZM8 12h8M8 16h5"/></svg></span></button>
        <button id="clearCacheBtn" class="menu-item danger">
            <span>Очистити кеш</span>
            <span class="menu-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></span>
        </button>
            </div>
        </section>
    </div>

    <div class="app-wrapper" id="appWrapper">
        <div class="top-area" id="topArea">
            <div class="welcome-screen" id="welcomeScreen">
                <span class="welcome-kicker">Товари та накладні</span>
                <h1>Пошук товарів</h1>
                <p>Введіть назву, код або скористайтеся сканером</p>
            </div>

            <div class="search-container" id="searchContainer">
                <div class="search-box">
                    <span class="search-icon">
                        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
                    </span>
                    <input type="text" id="goodsSearch" placeholder="Назва, код або штрихкод" autocomplete="off">
                    <button type="button" class="search-clear" id="searchClear" aria-label="Очистити" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                    <button type="button" class="numeric-toggle" id="numericToggle" aria-label="Цифрова клавіатура">123</button>
                </div>
                
                <button type="button" class="btn-add-main" id="mainAddBtn">
                    <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Додати
                </button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <!-- Кнопка наверх -->
    <button id="backToTop" class="back-to-top" type="button" aria-label="Догори">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
    </button>

    <!-- ПЛАВАЮЩАЯ КНОПКА СКАНЕРА (ТА САМАЯ КРАСНАЯ) -->
    <button class="fab-scanner" id="scanBtn" aria-label="Сканувати штрихкод">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="7" y2="12.01"/><line x1="10" y1="9" x2="10" y2="15"/><line x1="14" y1="9" x2="14" y2="15"/><line x1="17" y1="12" x2="17" y2="12.01"/></svg>
    </button>

    <!-- Универсальный диалог -->
    <div id="confirmDialogOverlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="confirmDialogTitle"></h3>
            </div>
            <div class="modal-body">
                <p id="confirmDialogMessage"></p>
                <div id="confirmDialogDetails"></div>
            </div>
            <div class="modal-footer">
                <button id="confirmDialogCancel" type="button" class="action-btn btn-secondary"></button>
                <button id="confirmDialogOk" type="button" class="action-btn"></button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ДОДАТИ -->
    <div class="modal-overlay" id="shipmentOverlay" style="z-index: 1050;">
        <div class="modal-box assort-box">
            <div class="modal-header">
                <div class="assort-head">
                    <h3>Нове замовлення</h3>
                </div>
                <button class="modal-close" type="button" aria-label="Закрити">✕</button>
            </div>
            <div class="modal-body" id="shipmentBody"></div>
            <div class="modal-footer order-footer" id="shipmentFooter" hidden>
                <div class="order-summary" id="shipmentSummary"></div>
                <button class="action-btn btn-success" type="button" id="shipmentSendBtn" disabled>Створити замовлення</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"><span id="toastMessage">Успішно!</span></div>

    <div id="appVersion" class="app-version"></div>

    <!-- СКРИПТЫ -->
    <script src="version.js"></script>
    <script src="javascript/config.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/core/utils.js"></script>
    <script src="javascript/core/storage.js"></script>
    <script src="javascript/core/api.js"></script>
    <script src="javascript/core/queue.js"></script>
    <script src="javascript/core/locks.js"></script>
    <script src="javascript/core/state.js"></script>
    <script src="javascript/ui/icons.js"></script>
    <script src="javascript/ui/rows.js"></script>
    <script src="javascript/ui/toast.js"></script>
    <script src="javascript/ui/status.js"></script>
    <script src="javascript/ui/focus.js"></script>
    <script src="javascript/ui/dialog.js"></script>
    <script src="javascript/ui/theme.js"></script>
    <script src="javascript/ui/backToTop.js"></script>
    <script src="javascript/ui/modalDrag.js"></script>
    <script src="javascript/ui/quantityKeyboard.js"></script>
    <script src="javascript/features/invoiceHistory.js"></script>
    <script src="javascript/features/shipmentDraft.js"></script>
    <script src="javascript/shipment.js"></script>
    <script src="javascript/features/recentSearches.js"></script>
    <script src="javascript/features/search.js"></script>
    <script src="javascript/features/goods-card.js"></script>
    <script src="javascript/app/load.js"></script>
    <script src="javascript/app/sync.js"></script>
    <script src="javascript/app/submit.js"></script>
    <script src="javascript/app/clearCache.js"></script>
    <script src="javascript/app/events.js"></script>
    <script src="javascript/app/refresh.js"></script>
    <script src="javascript/app/reset.js"></script>
    <script src="javascript/app/init.js"></script>
    <script src="javascript/zbar-wasm.js"></script>
    <script src="javascript/barcode-polyfill.js"></script>
    <script>
        try { window['BarcodeDetector'].getSupportedFormats(); }
        catch (e) { window['BarcodeDetector'] = barcodeDetectorPolyfill.BarcodeDetectorPolyfill; }
    </script>
    <script src="javascript/scanner.js"></script>
    <script src="javascript/optimize.js"></script>
</body>
</html>
